<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #555;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #2980b9;
        }

        img {
            margin-top: 20px;
            width: 250px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Web Page</h1>
    <p>This is a simple HTML example with CSS and a button.</p>

    <button onclick="showMessage()">Click Me</button>

    <p id="message"></p>

    <img src="https://via.placeholder.com/250" alt="Sample Image">

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Hello! You clicked the button.";
        }
    </script>

</body>
</html>
